<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="text-white">
        <strong th:text="${currentUser.email}"></strong>

        <span> with roles: </span>

        <span th:each="role : ${currentUser.roles}"
              th:text="${#strings.replace(role.name, 'ROLE_', '')}"
              class="mr-1">
        </span>
    </div>

    <form method="post" th:action="@{/logout}" class="mb-0">
        <button type="submit" class="btn btn-link text-white-50">
            Logout
        </button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 bg-white pt-3"
               style="min-height: calc(100vh - 56px);">

            <div class="nav flex-column nav-pills">
                <a class="nav-link active" th:href="@{/admin}">
                    Admin
                </a>

                <a class="nav-link" th:href="@{/user}">
                    User
                </a>
            </div>
        </aside>

        <main class="col-md-10 p-4">
            <h1 class="mb-4">Admin panel</h1>

            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin}">
                        Users table
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/new}">
                        New User
                    </a>
                </li>
            </ul>
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">All users</h5>
                </div>

                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.name}"></td>
                            <td th:text="${user.lastName}"></td>
                            <td th:text="${user.age}"></td>
                            <td th:text="${user.email}"></td>

                            <td>
        <span th:each="role : ${user.roles}"
              th:text="${#strings.replace(role.name, 'ROLE_', '')}"
              class="mr-1">
        </span>
                            </td>

                            <td class="text-nowrap">
                                <button type="button"
                                        class="btn btn-info btn-sm"
                                        data-toggle="modal"
                                        th:data-target="'#editModal' + ${user.id}">
                                    Edit
                                </button>
                            </td>
                            <td class="text-nowrap">
                                <button type="button"
                                        class="btn btn-danger btn-sm"
                                        data-toggle="modal"
                                        th:data-target="'#deleteModal' + ${user.id}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:each="user : ${users}"
     class="modal fade"
     th:id="'editModal' + ${user.id}"
     tabindex="-1"
     role="dialog"
     th:attr="aria-labelledby=${'editModalTitle' + user.id}"
     aria-hidden="true">

    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title"
                    th:id="'editModalTitle' + ${user.id}">
                    Edit user
                </h5>

                <button type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form method="post" th:action="@{/admin/update}">
                <div class="modal-body">
                    <div class="mx-auto text-center"
                         style="max-width: 300px;">

                        <div class="form-group">
                            <label th:for="'editId' + ${user.id}"
                                   class="font-weight-bold">ID</label>
                            <input type="text"
                                   th:id="'editId' + ${user.id}"
                                   name="id"
                                   th:value="${user.id}"
                                   class="form-control"
                                   readonly>
                        </div>

                        <div class="form-group">
                            <label th:for="'editName' + ${user.id}"
                                   class="font-weight-bold">First Name</label>
                            <input type="text"
                                   th:id="'editName' + ${user.id}"
                                   name="name"
                                   th:value="${user.name}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label th:for="'editLastName' + ${user.id}"
                                   class="font-weight-bold">
                                Last Name
                            </label>
                            <input type="text"
                                   th:id="'editLastName' + ${user.id}"
                                   name="lastName"
                                   th:value="${user.lastName}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label th:for="'editAge' + ${user.id}"
                                   class="font-weight-bold">
                                Age
                            </label>
                            <input type="number"
                                   th:id="'editAge' + ${user.id}"
                                   name="age"
                                   th:value="${user.age}"
                                   class="form-control"
                                   min="0"
                                   max="150"
                                   required>
                        </div>

                        <div class="form-group">
                            <label th:for="'editEmail' + ${user.id}"
                                   class="font-weight-bold">Email</label>
                            <input type="email"
                                   th:id="'editEmail' + ${user.id}"
                                   name="email"
                                   th:value="${user.email}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label th:for="'editPassword' + ${user.id}"
                                   class="font-weight-bold">Password</label>
                            <input type="password"
                                   th:id="'editPassword' + ${user.id}"
                                   name="password"
                                   class="form-control"
                                   autocomplete="new-password"
                                   placeholder="Оставьте пустым, чтобы сохранить пароль">
                        </div>

                        <div class="form-group">
                            <label th:for="'editRoles' + ${user.id}"
                                   class="font-weight-bold">Role</label>
                            <select th:id="'editRoles' + ${user.id}"
                                    name="roleIds"
                                    class="form-control"
                                    multiple
                                    size="2">
                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${#strings.replace(role.name, 'ROLE_', '')}"
                                        th:selected="${user.roles.contains(role)}">
                                </option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal">
                        Close
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Edit
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
<div th:each="user : ${users}"
     class="modal fade"
     th:id="'deleteModal' + ${user.id}"
     tabindex="-1"
     role="dialog"
     th:attr="aria-labelledby=${'deleteModalTitle' + user.id}"
     aria-hidden="true">

    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title"
                    th:id="'deleteModalTitle' + ${user.id}">
                    Delete user
                </h5>

                <button type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form method="post" th:action="@{/admin/delete}">
                <input type="hidden" name="id" th:value="${user.id}">

                <div class="modal-body">
                    <div class="mx-auto text-center"
                         style="max-width: 300px;">

                        <div class="form-group">
                            <label th:for="'deleteId' + ${user.id}"
                                   class="font-weight-bold">ID</label>
                            <input type="text"
                                   th:id="'deleteId' + ${user.id}"
                                   th:value="${user.id}"
                                   class="form-control"
                                   disabled>
                        </div>

                        <div class="form-group">
                            <label th:for="'deleteName' + ${user.id}"
                                   class="font-weight-bold">First Name</label>
                            <input type="text"
                                   th:id="'deleteName' + ${user.id}"
                                   th:value="${user.name}"
                                   class="form-control"
                                   disabled>
                        </div>

                        <div class="form-group">
                            <label th:for="'deleteLastName' + ${user.id}"
                                   class="font-weight-bold">Last Name</label>
                            <input type="text"
                                   th:id="'deleteLastName' + ${user.id}"
                                   th:value="${user.lastName}"
                                   class="form-control"
                                   disabled>
                        </div>

                        <div class="form-group">
                            <label th:for="'deleteAge' + ${user.id}"
                                   class="font-weight-bold">Age</label>
                            <input type="number"
                                   th:id="'deleteAge' + ${user.id}"
                                   th:value="${user.age}"
                                   class="form-control"
                                   disabled>
                        </div>

                        <div class="form-group">
                            <label th:for="'deleteEmail' + ${user.id}"
                                   class="font-weight-bold">Email</label>
                            <input type="email"
                                   th:id="'deleteEmail' + ${user.id}"
                                   th:value="${user.email}"
                                   class="form-control"
                                   disabled>
                        </div>

                        <div class="form-group">
                            <label th:for="'deleteRoles' + ${user.id}"
                                   class="font-weight-bold">Role</label>
                            <select th:id="'deleteRoles' + ${user.id}"
                                    class="form-control"
                                    multiple
                                    size="2"
                                    disabled>
                                <option th:each="role : ${user.roles}"
                                        th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                                </option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal">
                        Close
                    </button>

                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
