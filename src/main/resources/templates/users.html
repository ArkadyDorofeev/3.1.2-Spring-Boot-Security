<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="app-base" th:content="@{/}">
    <title>User management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="text-white"><strong id="currentEmail"></strong> with roles: <span id="currentRoles"></span></div>
    <form method="post" th:action="@{/logout}" class="mb-0">
        <button type="submit" class="btn btn-link text-white-50">Logout</button>
    </form>
</nav>
<div class="container-fluid"><div class="row">
    <aside class="col-md-2 bg-white pt-3" style="min-height: calc(100vh - 56px)">
        <div class="nav flex-column nav-pills">
            <a id="adminLink" class="nav-link" th:href="@{/admin}" hidden>Admin</a>
            <a id="userLink" class="nav-link" th:href="@{/user}">User</a>
        </div>
    </aside>
    <main class="col-md-10 p-4">
        <div id="pageError" class="alert alert-danger" role="alert" hidden></div>
<section id="adminPanel">
<h1 class="mb-4">Admin panel</h1>
<ul class="nav nav-tabs">
    <li class="nav-item"><button id="tableTab" type="button" class="nav-link active">Users table</button></li>
    <li class="nav-item"><button id="newTab" type="button" class="nav-link">New User</button></li>
</ul>
<div id="tablePanel" class="card">
    <div class="card-header"><h5 class="mb-0">All users</h5></div>
    <div class="card-body table-responsive"><table class="table table-striped">
        <thead><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th><th>Edit</th><th>Delete</th></tr></thead>
        <tbody id="usersTableBody"></tbody>
    </table></div>
</div>
<div id="newPanel" class="card" hidden>
    <div class="card-header"><h5 class="mb-0">Add new user</h5></div>
    <div class="card-body"><form id="createForm" class="mx-auto text-center" style="max-width:300px">
        <div id="createError" class="alert alert-danger" role="alert" hidden></div>
<div class="form-group"><label for="createname" class="font-weight-bold">First Name</label><input id="createname" name="name" type="text" class="form-control" required></div>
<div class="form-group"><label for="createlastName" class="font-weight-bold">Last Name</label><input id="createlastName" name="lastName" type="text" class="form-control" required></div>
<div class="form-group"><label for="createage" class="font-weight-bold">Age</label><input id="createage" name="age" type="number" class="form-control" required min="0" max="150" step="1"></div>
<div class="form-group"><label for="createemail" class="font-weight-bold">Email</label><input id="createemail" name="email" type="email" class="form-control" required></div>
<div class="form-group"><label for="createpassword" class="font-weight-bold">Password</label><input id="createpassword" name="password" type="password" class="form-control" required autocomplete="new-password"></div>
<div class="form-group"><label for="createroles" class="font-weight-bold">Role</label><select id="createroles" name="roleIds" class="form-control" multiple size="2" required></select></div>
        <button type="submit" class="btn btn-success">Add new user</button>
    </form></div>
</div></section><section id="profilePanel" hidden>
    <h1 class="mb-4">User information-page</h1>
    <div class="card"><div class="card-header"><h5 class="mb-0">About user</h5></div>
        <div class="card-body table-responsive"><table class="table table-striped">
            <thead><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th></tr></thead>
            <tbody id="profileTableBody"></tbody>
        </table></div>
    </div>
</section></main></div></div><div id="editModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="editTitle" aria-hidden="true">
<div class="modal-dialog" role="document"><div class="modal-content">
    <div class="modal-header"><h5 id="editTitle" class="modal-title">Edit user</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>
    <form id="editForm">
        <div class="modal-body"><div class="mx-auto text-center" style="max-width:300px">
            <div id="editError" class="alert alert-danger" role="alert" hidden></div>
            <div class="form-group"><label for="editid" class="font-weight-bold">ID</label><input id="editid" name="id" type="text" class="form-control" readonly></div>
<div class="form-group"><label for="editname" class="font-weight-bold">First Name</label><input id="editname" name="name" type="text" class="form-control" required></div>
<div class="form-group"><label for="editlastName" class="font-weight-bold">Last Name</label><input id="editlastName" name="lastName" type="text" class="form-control" required></div>
<div class="form-group"><label for="editage" class="font-weight-bold">Age</label><input id="editage" name="age" type="number" class="form-control" required min="0" max="150" step="1"></div>
<div class="form-group"><label for="editemail" class="font-weight-bold">Email</label><input id="editemail" name="email" type="email" class="form-control" required></div>
<div class="form-group"><label for="editpassword" class="font-weight-bold">Password</label><input id="editpassword" name="password" type="password" class="form-control" autocomplete="new-password" placeholder="Оставьте пустым, чтобы сохранить пароль"></div>
<div class="form-group"><label for="editroles" class="font-weight-bold">Role</label><select id="editroles" name="roleIds" class="form-control" multiple size="2" required></select></div>
        </div></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Edit</button>
        </div>
    </form>
</div></div></div><div id="deleteModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="deleteTitle" aria-hidden="true">
<div class="modal-dialog" role="document"><div class="modal-content">
    <div class="modal-header"><h5 id="deleteTitle" class="modal-title">Delete user</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>
    <form id="deleteForm">
        <div class="modal-body"><div class="mx-auto text-center" style="max-width:300px">
            <div id="deleteError" class="alert alert-danger" role="alert" hidden></div>
            <div class="form-group"><label for="deleteid" class="font-weight-bold">ID</label><input id="deleteid" name="id" type="text" class="form-control" readonly></div>
<div class="form-group"><label for="deletename" class="font-weight-bold">First Name</label><input id="deletename" name="name" type="text" class="form-control" disabled></div>
<div class="form-group"><label for="deletelastName" class="font-weight-bold">Last Name</label><input id="deletelastName" name="lastName" type="text" class="form-control" disabled></div>
<div class="form-group"><label for="deleteage" class="font-weight-bold">Age</label><input id="deleteage" name="age" type="number" class="form-control" disabled min="0" max="150" step="1"></div>
<div class="form-group"><label for="deleteemail" class="font-weight-bold">Email</label><input id="deleteemail" name="email" type="email" class="form-control" disabled></div>
<div class="form-group"><label for="deleteroles" class="font-weight-bold">Role</label><select id="deleteroles" name="roleIds" class="form-control" multiple size="2" disabled></select></div>
        </div></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-danger">Delete</button>
        </div>
    </form>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body></html>
