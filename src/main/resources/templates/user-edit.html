<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit user</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="text-white">
        <strong th:text="${currentUser.email}"></strong>
        <span> with roles: </span>

        <span th:each="role : ${currentUser.roles}"
              th:text="${#strings.replace(role.name, 'ROLE_', '')}"
              class="mr-1">
        </span>
    </div>

    <form method="post" th:action="@{/logout}" class="mb-0">
        <button type="submit" class="btn btn-link text-white-50">
            Logout
        </button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 bg-white pt-3"
               style="min-height: calc(100vh - 56px);">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active" th:href="@{/admin}">
                    Admin
                </a>
                <a class="nav-link" th:href="@{/user}">
                    User
                </a>
            </div>
        </aside>

        <main class="col-md-10 p-4">
            <h1 class="mb-4">Admin panel</h1>

            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        Users table
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/new}">
                        New User
                    </a>
                </li>
            </ul>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Edit user</h5>
                </div>

                <div class="card-body">
                    <div th:if="${error}"
                         th:text="${error}"
                         class="alert alert-danger"
                         role="alert">
                    </div>

                    <form method="post"
                          th:action="@{/admin/update}"
                          th:object="${user}"
                          class="mx-auto text-center"
                          style="max-width: 330px;">

                        <div class="form-group">
                            <label for="id" class="font-weight-bold">
                                ID
                            </label>
                            <input type="text"
                                   id="id"
                                   th:field="*{id}"
                                   class="form-control"
                                   readonly>
                        </div>

                        <div class="form-group">
                            <label for="name" class="font-weight-bold">
                                First Name
                            </label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="lastName" class="font-weight-bold">
                                Last Name
                            </label>
                            <input type="text"
                                   id="lastName"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="age" class="font-weight-bold">
                                Age
                            </label>
                            <input type="number"
                                   id="age"
                                   th:field="*{age}"
                                   class="form-control"
                                   min="0"
                                   max="150"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="email" class="font-weight-bold">
                                Email
                            </label>
                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="font-weight-bold">
                                Password
                            </label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   autocomplete="new-password"
                                   aria-describedby="passwordHelp">
                            <small id="passwordHelp"
                                   class="form-text text-muted">
                                Оставьте пустым, чтобы сохранить прежний пароль.
                            </small>
                        </div>

                        <div class="form-group">
                            <label for="roles" class="font-weight-bold">
                                Role
                            </label>
                            <select id="roles"
                                    name="roleIds"
                                    class="form-control"
                                    multiple
                                    size="2"
                                    required>
                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${#strings.replace(role.name, 'ROLE_', '')}"
                                        th:selected="${#lists.contains(user.roles.![id], role.id)}">
                                </option>
                            </select>
                        </div>

                        <a th:href="@{/admin}" class="btn btn-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
