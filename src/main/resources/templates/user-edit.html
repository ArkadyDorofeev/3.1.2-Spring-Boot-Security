<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать пользователя</title>
</head>
<body>
<h1>Редактировать пользователя</h1>
<p th:if="${error}" th:text="${error}" role="alert"></p>

<form method="post"
      th:action="@{/admin/update}"
      th:object="${user}">

    <input type="hidden" th:field="*{id}">

    <label>
        Имя:
        <input type="text" th:field="*{name}" required>
    </label>

    <label>
        Почта:
        <input type="email" th:field="*{email}" required>
    </label>

    <label>
        Новый пароль:
        <input type="password"
               name="password"
               autocomplete="new-password">
    </label>

    <p>Оставьте пароль пустым, чтобы сохранить прежний.</p>

    <p>Роли:</p>

    <label th:each="role : ${roles}">
        <input type="checkbox"
               name="roleIds"
               th:value="${role.id}"
               th:checked="${#lists.contains(user.roles.![id], role.id)}">
        <span th:text="${role.name}"></span>
    </label>

    <button type="submit">Сохранить</button>
</form>

<a th:href="@{/admin}">К списку</a>

<form method="post" th:action="@{/logout}">
    <button type="submit">Выйти</button>
</form>
</body>
</html>
