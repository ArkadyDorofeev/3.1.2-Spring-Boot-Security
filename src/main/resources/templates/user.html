<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="app-base" th:content="@{/}">
    <title>User management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="text-white"><strong id="currentEmail"></strong> with roles: <span id="currentRoles"></span></div>
    <form method="post" th:action="@{/logout}" class="mb-0">
        <button type="submit" class="btn btn-link text-white-50">Logout</button>
    </form>
</nav>
<div class="container-fluid"><div class="row">
    <aside class="col-md-2 bg-white pt-3" style="min-height: calc(100vh - 56px)">
        <div class="nav flex-column nav-pills">
            <a id="adminLink" class="nav-link" th:href="@{/admin}" hidden>Admin</a>
            <a id="userLink" class="nav-link" th:href="@{/user}">User</a>
        </div>
    </aside>
    <main class="col-md-10 p-4">
        <div id="pageError" class="alert alert-danger" role="alert" hidden></div>
<section id="profilePanel">
    <h1 class="mb-4">User information-page</h1>
    <div class="card"><div class="card-header"><h5 class="mb-0">About user</h5></div>
        <div class="card-body table-responsive"><table class="table table-striped">
            <thead><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th></tr></thead>
            <tbody id="profileTableBody"></tbody>
        </table></div>
    </div>
</section></main></div></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/user.js}"></script>
</body></html>
