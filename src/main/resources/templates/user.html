<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User information</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="text-white">
        <strong th:text="${user.email}"></strong>

        <span> with roles: </span>

        <span th:each="role : ${user.roles}"
              th:text="${#strings.replace(role.name, 'ROLE_', '')}"
              class="mr-1">
        </span>
    </div>

    <form method="post" th:action="@{/logout}" class="mb-0">
        <button type="submit" class="btn btn-link text-white-50">
            Logout
        </button>
    </form>
</nav>
<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 bg-white pt-3"
               style="min-height: calc(100vh - 56px);">

            <div class="nav flex-column nav-pills">
                <a class="nav-link"
                   th:if="${!user.roles.?[name == 'ROLE_ADMIN'].isEmpty()}"
                   th:href="@{/admin}">
                    Admin
                </a>

                <a class="nav-link active" th:href="@{/user}">
                    User
                </a>
            </div>
        </aside>

        <main class="col-md-10 p-4">
            <h1 class="mb-4">User information-page</h1>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">About user</h5>
                </div>

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr>
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.name}"></td>
                                <td th:text="${user.lastName}"></td>
                                <td th:text="${user.age}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span th:each="role : ${user.roles}"
                                          th:text="${#strings.replace(role.name, 'ROLE_', '')}"
                                          class="mr-1">
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

    </div>
</div>

</body>
</html>
